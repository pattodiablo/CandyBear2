<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Fluffy Donut</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        html,
        body {
            padding: 0px;
            margin: 0px;
            background: #242424;
            width: 100%;
            height: 100%;
            min-height: 100dvh;
            overflow: hidden;
        }

        body {
            font-family: sans-serif;
        }

        canvas {
            display: block;
            touch-action: none;
        }

        #orientation-overlay {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(11, 23, 30, 0.78);
            backdrop-filter: blur(5px);
            z-index: 10000;
        }

        #orientation-overlay.visible {
            display: flex;
        }

        .orientation-shell {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #fffaf1;
            gap: 18px;
            width: min(92vw, 460px);
            padding: 22px 18px 26px;
            box-sizing: border-box;
        }

        .orientation-device {
            position: relative;
            width: clamp(160px, 38vw, 200px);
            height: clamp(96px, 22vw, 126px);
            border-radius: 22px;
            border: 4px solid rgba(255, 255, 255, 0.9);
            background: linear-gradient(180deg, #203040 0%, #0b121c 100%);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            transform: rotate(90deg);
            animation: rotatePhone 1.8s ease-in-out infinite alternate;
            flex-shrink: 0;
        }

        .orientation-notch {
            position: absolute;
            top: 14px;
            left: 50%;
            width: 40px;
            height: 8px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.8);
            transform: translateX(-50%);
        }

        .orientation-screen {
            position: absolute;
            inset: 16px 12px 12px 12px;
            border-radius: 14px;
            background: linear-gradient(180deg, #ffd084 0%, #ff9b7a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #2d1b0e;
            font-weight: 800;
            font-size: 12px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .orientation-copy {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 100%;
            max-width: 420px;
            margin-top: 20px;
        }

        .orientation-title {
            font-size: clamp(28px, 4vw, 40px);
            line-height: 1.05;
            font-weight: 900;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            margin: 0;
        }

        .orientation-subtitle {
            margin: 0;
            max-width: 100%;
            font-size: 18px;
            line-height: 1.4;
            color: rgba(255, 250, 241, 0.88);
        }

        @keyframes rotatePhone {
            0% {
                transform: rotate(90deg) scale(0.96);
            }
            100% {
                transform: rotate(100deg) scale(1);
            }
        }

        #mobile-launch-overlay {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top, #3b3b3b 0%, #121212 70%);
            z-index: 9999;
        }

        #mobile-launch-overlay.visible {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }

        #mobile-launch-actions {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            width: min(320px, calc(100% - 32px));
        }

        .mobile-launch-button {
            border: 0;
            border-radius: 18px;
            padding: 18px 24px;
            width: 100%;
            font-size: 18px;
            font-weight: 700;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
        }

        #mobile-launch-button {
            background: #f2cf66;
            color: #2b2115;
        }

        #mobile-launch-button:disabled {
            opacity: 0.55;
            cursor: wait;
        }

        #mobile-launch-skip-button {
            background: transparent;
            color: rgba(255, 255, 255, 0.9);
            border: 2px solid rgba(255, 255, 255, 0.35);
            box-shadow: none;
        }

        #mobile-launch-skip-button:disabled {
            opacity: 0.55;
            cursor: wait;
        }

        #mobile-flush-button {
            background: #fd7db6;
            color: #ffffff;
            border: 3px solid #3e0307;
        }

        #mobile-flush-status {
            min-height: 20px;
            color: rgba(255, 255, 255, 0.9);
            text-align: center;
            font-size: 14px;
            line-height: 1.4;
        }

        #mobile-launch-hint {
            position: absolute;
            left: 50%;
            bottom: 40px;
            transform: translateX(-50%);
            width: min(320px, calc(100% - 32px));
            color: rgba(255, 255, 255, 0.85);
            text-align: center;
            font-size: 14px;
            line-height: 1.4;
        }
    </style>
</head>

<body>
    <div id="orientation-overlay" aria-live="polite">
        <div class="orientation-shell">
            <div class="orientation-device" aria-hidden="true">
                <div class="orientation-notch"></div>
                <div class="orientation-screen">Landscape</div>
            </div>
            <div class="orientation-copy">
                <h2 class="orientation-title">Gira tu dispositivo</h2>
                <p class="orientation-subtitle">Este juego debe jugarse en modo paisaje para disfrutar la experiencia completa.</p>
            </div>
        </div>
    </div>

    <div id="mobile-launch-overlay">
        <div id="mobile-launch-actions">
            <button id="mobile-launch-button" class="mobile-launch-button" type="button" disabled>Loading game...</button>
            <button id="mobile-launch-skip-button" class="mobile-launch-button" type="button" disabled>Skip</button>
            <button id="mobile-flush-button" class="mobile-launch-button" type="button">Clear Saved Data</button>
            <div id="mobile-flush-status" aria-live="polite"></div>
        </div>
    </div>
    <script>
        (function () {
            const isMobileDevice = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)
                || (navigator.maxTouchPoints > 0 && Math.min(screen.width, screen.height) < 1024);

            if (!isMobileDevice) {
                return;
            }

            const GAME_STORAGE_KEYS = [
                "candybear2-highest-completed-level",
                "candybear2-total-coins",
                "candybear2-level-stars",
                "candybear2-level-likes",
                "candybear2-total-likes",
                "candybear2-has-opened-before",
                "candybear2-acquired-products",
                "candybear2-acquired-workstations",
                "candybear2-bought-moment-cards"
            ];

            const overlay = document.getElementById("mobile-launch-overlay");
            const orientationOverlay = document.getElementById("orientation-overlay");
            const launchButton = document.getElementById("mobile-launch-button");
            const skipButton = document.getElementById("mobile-launch-skip-button");
            const flushButton = document.getElementById("mobile-flush-button");
            const flushStatus = document.getElementById("mobile-flush-status");

            const syncOrientationOverlay = () => {
                const isPortrait = window.innerHeight >= window.innerWidth;
                orientationOverlay.classList.toggle("visible", isPortrait);
            };

            syncOrientationOverlay();
            window.addEventListener("resize", syncOrientationOverlay, { passive: true });
            window.addEventListener("orientationchange", syncOrientationOverlay, { passive: true });

            const clearStoredProgress = () => {
                for (const storageKey of GAME_STORAGE_KEYS) {
                    window.localStorage.removeItem(storageKey);
                }
            };

            const requestFullscreen = async () => {
                const root = document.documentElement;
                const fullscreenElement = document.fullscreenElement || document.webkitFullscreenElement;

                if (fullscreenElement) {
                    return true;
                }

                try {
                    if (root.requestFullscreen) {
                        await root.requestFullscreen();
                        return true;
                    }

                    if (root.webkitRequestFullscreen) {
                        root.webkitRequestFullscreen();
                        return true;
                    }
                } catch (_) {
                    return false;
                }

                return false;
            };

            const expandBrowserArea = () => {
                document.body.style.minHeight = "100dvh";
                window.scrollTo(0, 1);
            };

            const lockOrientation = async () => {
                try {
                    if (screen.orientation && screen.orientation.lock) {
                        await screen.orientation.lock("landscape");
                    }
                } catch (_) {
                    // Orientation lock is optional and unsupported on many mobile browsers.
                }
            };

            const refreshGameScale = () => {
                if (typeof window.refreshCandyBearGameScale === "function") {
                    window.refreshCandyBearGameScale();
                } else {
                    window.dispatchEvent(new Event("resize"));
                }
            };

            const bootGame = () => {
                if (typeof window.bootCandyBearGame === "function") {
                    window.bootCandyBearGame();
                    return;
                }

                window.addEventListener("candybear-game-ready", () => {
                    window.bootCandyBearGame?.();
                }, { once: true });
            };

            const launchGame = async (useFullscreen = true) => {
                if (launchButton.disabled) {
                    return;
                }

                launchButton.disabled = true;
                skipButton.disabled = true;
                overlay.classList.remove("visible");
                expandBrowserArea();
                bootGame();

                if (useFullscreen) {
                    await requestFullscreen();
                }

                refreshGameScale();
                window.requestAnimationFrame(() => {
                    refreshGameScale();
                    window.requestAnimationFrame(refreshGameScale);
                });
                window.setTimeout(refreshGameScale, 200);

                if (useFullscreen) {
                    await lockOrientation();
                }

                window.setTimeout(refreshGameScale, 400);
            };

            const flushStoredProgress = () => {
                const confirmed = window.confirm(
                    "Clear all saved progress? This removes unlocked levels, stars, and coins."
                );

                if (!confirmed) {
                    return;
                }

                clearStoredProgress();
                flushStatus.textContent = "Saved data cleared. Tap play to start fresh.";
            };

            const enableLaunchButtons = () => {
                launchButton.disabled = false;
                skipButton.disabled = false;
                launchButton.textContent = "Tap To Play Fullscreen";
            };

            overlay.classList.add("visible");
            launchButton.addEventListener("click", () => launchGame(true), { once: true });
            skipButton.addEventListener("click", () => launchGame(false), { once: true });
            flushButton.addEventListener("click", flushStoredProgress);

            if (typeof window.bootCandyBearGame === "function") {
                enableLaunchButtons();
            } else {
                window.addEventListener("candybear-game-ready", enableLaunchButtons, { once: true });
            }
        })();
    </script>
</body>

</html>
