<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Fluffy Donut</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        html,
        body {
            padding: 0px;
            margin: 0px;
            background: #242424;
            width: 100%;
            height: 100%;
            min-height: 100dvh;
            overflow: hidden;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            box-sizing: border-box;
        }

        body {
            font-family: sans-serif;
        }

        canvas {
            display: block;
            touch-action: none;
        }

    </style>
</head>

<body>
    <script>
        (function () {
            // No bloqueamos con una pantalla de "gira tu dispositivo": Poki recomienda
            // soportar ambas orientaciones (los juegos landscape-only pierden entrada de
            // jugadores en promedio). Phaser.Scale.FIT ya escala solo al espacio disponible;
            // esto solo empuja un recálculo cuando el viewport cambia (rotación, teclado,
            // barra del navegador mobile apareciendo/ocultándose), que a veces no dispara
            // un "resize" nativo a tiempo por su cuenta.
            const isMobileDevice = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)
                || (navigator.maxTouchPoints > 0 && Math.min(screen.width, screen.height) < 1024);

            if (!isMobileDevice) {
                return;
            }

            const refreshGameScale = () => {
                if (typeof window.refreshCandyBearGameScale === "function") {
                    window.refreshCandyBearGameScale();
                    return;
                }
                window.dispatchEvent(new Event("resize"));
            };

            const scheduleRefresh = () => {
                refreshGameScale();
                window.requestAnimationFrame(refreshGameScale);
                window.setTimeout(refreshGameScale, 150);
                window.setTimeout(refreshGameScale, 400);
            };

            window.addEventListener("resize", scheduleRefresh, { passive: true });
            window.addEventListener("orientationchange", scheduleRefresh, { passive: true });
            window.visualViewport?.addEventListener("resize", scheduleRefresh, { passive: true });
        })();
    </script>
</body>

</html>
